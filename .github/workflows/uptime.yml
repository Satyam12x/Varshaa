# Uptimer for the VARSHA API on Render.
# - every 10 min: ping /api/health (keeps the free instance from sleeping, fails if the API is down)
# - daily 11:00 IST: strict check, fails if today's forecast was not produced
# Set the repository variable VARSHA_API_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://varsha-api.onrender.com. A failed run emails the repository owner.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  health:
    if: vars.VARSHA_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping /api/health
        run: node backend/scripts/health.mjs "${{ vars.VARSHA_API_URL }}" ${{ github.event.schedule == '30 5 * * *' && '--strict' || '' }}
